name: Linux backend contracts

on:
  push:
    branches: [main, refactor/llm-clean]
  pull_request:
  workflow_dispatch:
    inputs:
      test_latest:
        description: Resolve latest allowed dependencies for an upgrade assessment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [llm, hub]
    env:
      ISH_REVISION: d833790959a76ac457fdeea3f21a6bea1eecfe12
      TERM: xterm-256color
      HUB_TEST_XVFB: /usr/bin/Xvfb
      HUB_TEST_XCLIP: /usr/bin/xclip
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      LITELLM_MODE: "PRODUCTION"
      TEST_LATEST: ${{ inputs.test_latest == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out the external host reference
        uses: actions/checkout@v7
        with:
          repository: E1der0wL/ish
          ref: ${{ env.ISH_REVISION }}
          path: ish.platform
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ish.platform/pyproject.toml
            tests/llm/dependencies-linux.lock
      - name: Install test dependencies (not the plugin)
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from tests.llm.dependencies import LOCK, check, lock_inputs
          errors = check()
          if errors:
              raise SystemExit("\n".join(errors))
          latest = os.environ["TEST_LATEST"] == "true"
          arguments = (["--upgrade", *lock_inputs()["requirements"]] if latest
              else ["--require-hashes", "-r", str(LOCK)])
          subprocess.check_call([sys.executable, "-m", "pip", "install", *arguments])
          subprocess.check_call([sys.executable, "-m", "pip", "check"])
          if not latest:
              subprocess.check_call([sys.executable, "-m", "tests.llm.dependencies", "--installed"])
          PY
      - name: Install required Linux test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap xvfb xclip tesseract-ocr tesseract-ocr-eng
      - name: Authorize only the packaged namespace launcher
        run: |
          test "$(id -u)" != 0
          test "$(readlink -f "$(command -v bwrap)")" = /usr/bin/bwrap
          test "$(stat -c %u /usr/bin/bwrap)" = 0
          test ! -u /usr/bin/bwrap
          test ! -w /usr/bin/bwrap
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          sudo install -m 0644 tests/llm/ci/bwrap.apparmor /etc/apparmor.d/ish-llm-ci-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/ish-llm-ci-bwrap
          bwrap --unshare-all --ro-bind / / -- /usr/bin/true
          # An unrelated launcher must remain restricted; never run Tool tests as sudo.
          mkdir -p artifacts
          if unshare --user --map-root-user --net /usr/bin/true > artifacts/unshare-control.log 2>&1; then
            echo "::error::Unrelated user namespace launcher unexpectedly became unrestricted"
            exit 1
          fi
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          python - <<'PY'
          from tests.llm.checks_output import emit_annotation
          emit_annotation("Namespace launcher policy", {
              "global_apparmor_restriction": 1, "bwrap_smoke": "passed",
              "unrelated_unshare": "denied", "tool_tests_run_as_root": False,
          }, level="notice")
          PY
      - name: Check environment and namespace isolation
        id: environment
        run: >-
          python -m tests.llm.check_environment --suite "${{ matrix.suite }}"
          --host-revision "$ISH_REVISION" --output artifacts/environment.json
      - name: Check documentation
        if: ${{ !cancelled() }}
        run: python -m tests.llm.check_docs --output artifacts/docs.json
      - name: Reject new architectural audit debt
        if: ${{ !cancelled() }}
        run: python -m tests.llm.check_architecture --require S1 --require S2 --require S3 --require S4 --require S5 --require S6 --require S7 --output artifacts/architecture.json
      - name: Verify R3 dropped-limit mutation detection
        if: ${{ !cancelled() && matrix.suite == 'llm' }}
        run: python -m tests.llm.check_budget_mutation
      - name: Diagnose real SDK integration with offline transports
        if: ${{ !cancelled() && matrix.suite == 'llm' && steps.environment.outcome == 'success' }}
        run: python -m tests.llm.check_provider_environment --output artifacts/provider-environment.json
      - name: Discover and execute every assigned regression test
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: >-
          python -m tests.llm.run_regression --suite "${{ matrix.suite }}"
          --output artifacts/regression.json
      - name: Preserve gate evidence including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ matrix.suite }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
