[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ish-llm"
version = "0.1.0"
description = "Durable AI execution plugin for the ish platform"
requires-python = "==3.12.14"
classifiers = ["Operating System :: POSIX :: Linux"]
dependencies = [
    "litellm>=1.100,<2",
    "jsonschema>=4.23,<5",
    "langgraph>=1.2.12,<2",
]

[project.optional-dependencies]
rag = ["chromadb", "kuzu", "rank-bm25"]

[tool.setuptools.packages.find]
include = ["llm", "llm.*"]
exclude = ["llm.tests", "llm.tests.*", "llm.examples", "llm.examples.*"]
